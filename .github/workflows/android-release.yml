name: Android Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LPMS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lpms-release.jks"

      - name: Build signed release AAB and APK
        env:
          LPMS_KEYSTORE_PATH: ${{ runner.temp }}/lpms-release.jks
          LPMS_KEYSTORE_PASSWORD: ${{ secrets.LPMS_KEYSTORE_PASSWORD }}
          LPMS_KEY_ALIAS: ${{ secrets.LPMS_KEY_ALIAS }}
          LPMS_KEY_PASSWORD: ${{ secrets.LPMS_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lpms-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
